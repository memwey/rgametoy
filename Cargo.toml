[package]
name = "rgametoy"
version = "0.1.0"
edition = "2021"

[features]
default = []
# Real-time audio output via cpal. Off by default so the core stays
# dependency-free; the APU always produces samples regardless.
audio = ["dep:cpal"]
# Read-only inspection of the running machine (state snapshots + breakpoints),
# for calibrating against hardware test ROMs. Off by default so the release
# build carries no debug surface; enable with `--features debug`. See
# `examples/inspect.rs`.
debug = []

[dependencies]
minifb = "0.25"
cpal = { version = "0.15", optional = true }

[lib]
name = "rgametoy"
path = "src/lib.rs"
