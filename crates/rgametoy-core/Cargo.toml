[package]
name = "rgametoy-core"
description = "Emulated DMG Game Boy core (CPU/PPU/APU/timer/cartridge) — deterministic, dependency-free, wasm-ready."
version.workspace = true
edition.workspace = true

[features]
default = []
# Read-only inspection of the running machine (state snapshots + breakpoints)
# for calibrating against hardware test ROMs. Off by default so a release build
# carries no debug surface. See examples/inspect.rs.
debug = []
# Whole-machine save-state serialization: turn the entire machine into a
# portable byte blob and back. An *emulator* convenience (a real Game Boy can't
# snapshot itself), so it's opt-in — the featureless core is just the machine.
# The core only serializes; a frontend decides whether to persist the bytes or
# hold them in memory. Frontends that offer save-states (desktop, web) enable it.
serialize = []
