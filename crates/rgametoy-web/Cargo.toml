[package]
name = "rgametoy-web"
description = "Web frontend for the rgametoy Game Boy emulator (DMG)."
version.workspace = true
edition.workspace = true

# `cdylib` so Trunk/wasm-bindgen can produce a `.wasm` artifact.
# `rlib` so we can still write unit tests for the host glue.
[lib]
name = "rgametoy_web"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
rgametoy-core = { workspace = true, features = ["serialize"] }
wasm-bindgen = "0.2"
js-sys = "0.3"

# Pull in every browser API the host glue needs. Adding them all up front
# avoids churning Cargo.toml every phase; the dead features are stripped
# by wasm-bindgen / LLVM so there's no runtime cost.
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement",
    "HtmlCanvasElement", "CanvasRenderingContext2d", "ImageData",
    "HtmlInputElement", "HtmlButtonElement", "HtmlAnchorElement",
    "File", "FileList", "FileReader", "Blob", "BlobPropertyBag", "Url", "Event", "KeyboardEvent",
    "AudioContext", "AudioBuffer", "AudioProcessingEvent", "ScriptProcessorNode",
    "AudioDestinationNode", "EventTarget", "console",
    "IdbFactory", "IdbOpenDbRequest", "IdbOpenDbOptions",
    "IdbDatabase", "IdbRequest", "IdbObjectStore", "IdbObjectStoreParameters",
    "IdbTransaction", "IdbTransactionMode",
    "DomException",
] }

console_error_panic_hook = "0.1"
