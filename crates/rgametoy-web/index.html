<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rgametoy</title>
  <link data-trunk rel="css" href="style/main.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1 class="title">rgametoy</h1>
      <div class="info">
        <span id="status">starting&hellip;</span>
        <span id="fps" class="fps">0 fps</span>
      </div>
    </header>

    <main class="stage">
      <div class="screen-wrap">
        <canvas id="screen" width="160" height="144"></canvas>
      </div>
    </main>

    <footer class="controls">
      <button id="load-button" type="button">Load ROM</button>
      <button id="pause-button" type="button">Pause</button>
      <button id="reset-button" type="button">Reset</button>
      <button id="palette-button" type="button">Cycle palette</button>
      <button id="screenshot-button" type="button">Screenshot</button>
      <button id="audio-button" type="button">Enable audio</button>
      <span class="hint">&larr;&uarr;&rarr;&darr; move &middot; Z A &middot; X B &middot; Enter Start &middot; R-Shift Select &middot; Space fast-fwd &nbsp;|&nbsp; 5 save &middot; 7 load &middot; 2 shot &middot; 3 palette</span>
      <input id="rom-input" type="file" accept=".gb,.gbc" hidden />
    </footer>
  </div>
</body>
</html>
